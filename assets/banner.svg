    </g>
    <text x="459" y="218" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="62" font-weight="700" letter-spacing="18" fill="#e63946" filter="url(#soft)" opacity=".5">OPHION
      <animate attributeName="opacity" values=".25;.7;.25" dur="4s" repeatCount="indefinite"/></text>
    <text x="459" y="218" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="62" font-weight="700" letter-spacing="18" fill="#f4f1ee">OPHION
      <animate attributeName="opacity" from="0" to="1" dur="1.6s" fill="freeze"/></text>
    <text x="455" y="248" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" letter-spacing="10" fill="#e63946">THE BLIND SEER</text>
    <text x="450" y="286" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#bdb7b7" opacity="1">A curated technical knowledge vault<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.000;0.030;0.300;0.330;1.000" dur="15s" repeatCount="indefinite"/></text>
    <text x="450" y="286" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#bdb7b7" opacity="0">Tools  ·  Tricks  ·  Resources<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.000;0.333;0.363;0.633;0.663;1.000" dur="15s" repeatCount="indefinite"/></text>
    <text x="450" y="286" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="18" font-style="italic" fill="#bdb7b7" opacity="0">“I have seen everything, yet I have never seen myself.”<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.000;0.667;0.697;0.967;0.997;1.000" dur="15s" repeatCount="indefinite"/></text>
