    </circle>
    <clipPath id="eyeclip"><path d="M-50,0 Q0,-34 50,0 Q0,34 -50,0 Z"><animate attributeName="d" values="M-50,0 Q0,-34 50,0 Q0,34 -50,0 Z;M-50,0 Q0,-34 50,0 Q0,34 -50,0 Z;M-50,0 Q0,0 50,0 Q0,0 -50,0 Z;M-50,0 Q0,-34 50,0 Q0,34 -50,0 Z;M-50,0 Q0,-34 50,0 Q0,34 -50,0 Z" keyTimes="0;0.9;0.94;0.98;1" dur="6s" repeatCount="indefinite"/></path></clipPath>
    <path d="M-50,0 Q0,-34 50,0 Q0,34 -50,0 Z" fill="#0f0709" stroke="#e63946" stroke-width="2" filter="url(#glow)"><animate attributeName="d" values="M-50,0 Q0,-34 50,0 Q0,34 -50,0 Z;M-50,0 Q0,-34 50,0 Q0,34 -50,0 Z;M-50,0 Q0,0 50,0 Q0,0 -50,0 Z;M-50,0 Q0,-34 50,0 Q0,34 -50,0 Z;M-50,0 Q0,-34 50,0 Q0,34 -50,0 Z" keyTimes="0;0.9;0.94;0.98;1" dur="6s" repeatCount="indefinite"/></path>
