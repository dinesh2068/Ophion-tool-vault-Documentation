<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="t d">
  <title id="t">OPHION — The Blind Seer</title>
  <desc id="d">An animated banner: a clouded, blind eye slowly scans and blinks inside rotating sigil rings above the word OPHION.</desc>
  <defs>
    <radialGradient id="iris"><stop offset="0" stop-color="#ff5a66"/><stop offset=".6" stop-color="#b3121f"/><stop offset="1" stop-color="#4a0710"/></radialGradient>
    <radialGradient id="cloud"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#cfc9c9" stop-opacity=".75"/></radialGradient>
    <filter id="glow" x="-40%" y="-60%" width="180%" height="220%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>

    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0b0d"/><stop offset="1" stop-color="#1c0508"/></linearGradient>
    <radialGradient id="halo" cx="50%" cy="27%" r="48%"><stop offset="0" stop-color="#e63946" stop-opacity=".38"/><stop offset="1" stop-color="#e63946" stop-opacity="0"/></radialGradient>
    <linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#ff8a94" stop-opacity="0"/><stop offset=".5" stop-color="#ff8a94"/><stop offset="1" stop-color="#ff8a94" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="8s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="card"><rect width="900" height="320" rx="14"/></clipPath>
  </defs>
